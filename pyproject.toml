[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openusb-toolkit"
version = "0.1.0"
description = "Open-source USB device inspection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "openusb-toolkit contributors" }]
dependencies = [
  "pyusb>=1.2.1",
  "libusb-package>=1.0.26.0",
]

[project.scripts]
usbprobe = "openusb_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
